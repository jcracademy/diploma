<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diploma Exam Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>  

    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .sticky-header {
            position: sticky; top: 0; background: #f4f6f9; z-index: 1000;
            padding-top: 15px; padding-bottom: 5px; border-bottom: 2px solid #ddd; margin-bottom: 20px;
        }
        .header { font-size: 26px; font-weight: bold; color: #2c3e50; }
        .dateBtn { 
            width: 38px; height: 38px; line-height: 38px; 
            margin: 2px; cursor: pointer; border-radius: 5px; 
            display: inline-block; font-weight: 500; transition: all 0.2s; 
            text-align: center; border: 1px solid #dee2e6;
        }
        .dateBtn:hover { background-color: #1abc9c !important; color: white; transform: scale(1.1); }
        .has-exam { background-color: #f1c40f !important; color: #000; border-color: #f39c12; }
        .no-exam { background-color: #ffffff; color: #6c757d; }
        .dropdown-menu { min-width: 280px !important; border: none; }
        .download-btns button { margin-bottom: 5px; width: 100%; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="sticky-header">
        <div class="header"> Diploma Exam Management System </div>
        <div class="fs-6 text-secondary"> Center: Pirganj Govt. TSC, Thakurgaon </div>
    </div>

    <div id="standardSearch" class="card mb-3 shadow-sm border-0">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Subject Code / Roll</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Enter Subject Code..." oninput="validateOfflineCode(this.value)">
                </div>
                <div class="col-md-9 d-flex align-items-end flex-wrap">
                    <button class="btn btn-primary me-2" onclick="searchBySubjectCode()"> Search </button>
                    <button class="btn btn-primary me-2" onclick="searchByRoll()"> Search with Roll </button>
                    <button class="btn btn-dark text-white me-2" onclick="toggleSearch(true)"> Specific Search </button>

                    <div class="dropdown d-inline-block me-2">
                        <button class="btn btn-warning dropdown-toggle" type="button" id="dateDropdown" data-bs-toggle="dropdown"> Examinee on Date </button>
                        <ul class="dropdown-menu shadow p-3">
                            <li><h6 class="dropdown-header px-0">Select Exam Date (March 2026)</h6></li>
                            <div class="d-flex flex-wrap" id="dateContainer"></div>
                            <li class="mt-2 small text-muted text-center">Yellow = Exam Day</li>
                        </ul>
                    </div>
                
                    <button class="btn btn-success" onclick="goToShironamPage()"> শিরোনাম পত্র </button>
                </div>
            </div>
        </div>
    </div>

    <div id="specificSearch" class="card mb-3 shadow-sm border-0" style="display: none;">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label fw-bold">Institute</label><select id="specInst" class="form-select"><option value="">Select Institute</option></select></div>
                <div class="col-md-2"><label class="form-label fw-bold">Technology</label><select id="specTech" class="form-select"><option value="">Select Tech</option></select></div>
                <div class="col-md-2"><label class="form-label fw-bold">Semester</label><select id="specSemi" class="form-select"><option value="">Select Semi</option></select></div>    
                <div class="col-md-2"><label class="form-label fw-bold">Syllabus</label><select id="specSyllabus" class="form-select"><option value="">Select Syllabus</option></select></div>                                
                <div class="col-md-3 d-flex align-items-end flex-wrap">
                    <button class="btn btn-primary me-2 mb-2" onclick="filterSearch()"> Filter Search </button>
                    <button class="btn btn-secondary mb-2" onclick="toggleSearch(false)"> Back </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm border-0" style="padding: 20px;">
                <h5 class="border-bottom pb-2">Subject Info</h5>
                <p class="mb-1">Code: <span id="subDisplayCode" class="fw-bold">---</span></p>
                <p class="mb-1">Name: <span id="subDisplayName" class="fw-bold">---</span></p>
                <p class="mb-0 text-50 small">TF: <span id="subTF">---</span> | PF: <span id="subPF">---</span></p>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h6 class="card-title text-primary border-bottom pb-2">Institute Summary</h6>
                    <div id="instituteList" class="small mt-2">No summary...</div>
                </div>
            </div>
        </div>
<div class="col-md-4 mb-3">
    <div class="card h-100 shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                <h6 class="card-title text-danger mb-0">Downloads</h6>
                <button class="btn btn-sm text-primary fw-bold" onclick="toggleMoreButtons(this)" id="moreBtn" style="font-size: 12px; cursor: pointer;">
                    More Buttons (+)
                </button>
            </div>
            
            <div class="row row-cols-2 g-1 mt-2 download-btns">
                <div class="col"><button class="btn btn-sm btn-outline-dark w-100" onclick="downloadRolls()">Rolls</button></div>
                <div class="col"><button class="btn btn-sm btn-outline-dark w-100" onclick="downloadSeatLabels()">Seat Label</button></div>
                <div class="col"><button class="btn btn-sm btn-outline-dark w-100" onclick="downloadAttendanceSheet()">Attendance Sheet</button></div>
                <div class="col"><button class="btn btn-sm btn-outline-dark w-100" onclick="downloadQuestionCountPDF()">Question Count</button></div>
                <div class="col"><button class="btn btn-sm btn-outline-dark w-100" onclick="downloadRoutine()">Routine</button></div>
                <div class="col"><button class="btn btn-sm btn-outline-danger w-100" onclick="showPracticalExamineesTable()">Practical List</button></div>
                
                <div class="col extra-btn d-none">
                    <button class="btn btn-sm btn-outline-primary w-100" onclick="downloadCenterFee()">Center Fee</button>
                </div>
                <div class="col extra-btn d-none">
                    <button class="btn btn-sm btn-outline-primary w-100" onclick="downloadSeatPlan()">Seat Plan</button>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                <h5 class="mb-2"><span id="count" class="badge bg-secondary">Total Student: 0</span></h5>
                <div class="mb-2">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="sortTable('roll')">Sort with Roll</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="sortTable('sl')">Sort with SL</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center" id="mainTable">
                    <thead class="table-light">
                        <tr><th>SL</th><th>Roll</th><th>Semi</th><th>Dept</th><th>Name</th><th>Subject Codes</th><th>Action</th></tr>
                    </thead>
                    <tbody id="mytbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="report.js"></script> 
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxnmUcuFVLLK7pg9NsP8YVtC9LFjvhVMOV7vt08MWX09MIKl9LuNgZX4LXmR7jvHoZZ/exec"; 
    
    let allSubjectsData = {}; 
    let routineData = {};
    let currentStudents = [];
    let selectedDate = "13-03-2026"; 

    window.onload = function() {initDropdowns(); fetchAllData();};

    function fetchAllData() {
        fetch(API_URL + "?action=getBGData")
            .then(r => r.json())
            .then(res => {
                allSubjectsData = res.subjects;
                routineData = res.routine || {};
                generateDateButtons();
            })
            .catch(err => console.error("Data fetch error:", err));
    }


    function searchBySubjectCode() {
        const code = document.getElementById("searchInput").value.trim();
        const subInfo = allSubjectsData.find(s => s.code === code);
        
        if (!subInfo) { 
            Swal.fire("Invalid Subject Code", "এই কোডটি ডাটাবেসে পাওয়া যায়নি।", "error"); 
            return; 
        }
        
        updateSubjectDisplay(code, subInfo);
        
        Swal.fire({ title: 'Loading...', didOpen: () => Swal.showLoading() });
        fetch(API_URL + "?action=searchByCode&code=" + code)
            .then(r => r.json())
            .then(res => {
                Swal.close();
                console.log(res.students);
                currentStudents = res.students;
                renderTable(currentStudents);
                genSummary(currentStudents);
            });
    }

    function searchByRoll() {
        const roll = document.getElementById("searchInput").value.trim();
        if (!roll) return;
        Swal.fire({ title: 'Finding Roll...', didOpen: () => Swal.showLoading() });
        fetch(API_URL + "?action=searchByRoll&roll=" + roll).then(r => r.json()).then(res => {
            Swal.close();
            if (res.success) {
                const s = res.data;
                Swal.fire({ title: 'Examinee Profile', 
                html: `<div class="text-start p-2"><strong>Name:</strong> ${s.name}<br><strong>Roll:</strong> ${s.roll}<br><strong>Subjects:</strong> ${s.subcodeDetails}</div>` });
            } else { Swal.fire(res.error); }
        });
    }

    function renderTable(data) {
        document.getElementById("mytbody").innerHTML = data.map(s => `
            <tr>
                <td>${s.sl}</td>
                <td class="fw-bold">${s.roll}</td>
                <td>${s.semi}</td>
                <td>${s.dept}</td>                                
                <td class="text-start">${s.name}</td>
                <td>${s.subcodeDetails}</td>
            <td><button class="btn btn-sm btn-info text-white" onclick="showDetails('${s.roll}')">Details</button></td></tr>
        `).join('');
        document.getElementById("count").innerText = "Total Student: " + data.length;
    }

    function generateDateButtons() {
        let h = ""; 
        for (let i = 1; i <= 31; i++) { 
            let dayKey = i.toString().padStart(2, '0'); 
            let hasExam = routineData && routineData[dayKey] && routineData[dayKey].length > 0;
            let statusClass = hasExam ? "has-exam" : "no-exam";
            h += `<div class="dateBtn ${statusClass}" onclick="showDailySummary('${dayKey}')">${i}</div>`; 
        }
        document.getElementById("dateContainer").innerHTML = h;
    }

    function showDailySummary(date) {
        selectedDate = date + "-03-2026"; 
        const exams = routineData[date];

        if (!exams || exams.length === 0) { 
            Swal.fire({ icon: 'info', title: `Date: ${date}-03-2026`, text: "No exam scheduled." }); 
            return; 
        }

        let morningHtml = "";
        let eveningHtml = "";

        exams.forEach(ex => {
            const row = `
                <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                    <div class="text-start">
                        <span class="badge bg-primary me-2">${ex.subjectCode}</span>
                        <small class="text-secondary">Students: ${ex.examineeNos}</small>
                    </div>
                    <button class="btn btn-sm btn-success px-3" onclick="loadFullList('${ex.subjectCode}')">Load</button>
                </div>`;
            if (ex.time === "Morning") morningHtml += row;
            else eveningHtml += row;
        });

        let modalHtml = `
            <div class="text-start">
                <h6 class="bg-light p-2 border-start border-primary border-4">☀️ Morning Shift</h6>
                <div class="mb-3 px-2">${morningHtml || '<small class="text-muted">No exams</small>'}</div>
                <h6 class="bg-light p-2 border-start border-warning border-4">🌙 Evening Shift</h6>
                <div class="px-2">${eveningHtml || '<small class="text-muted">No exams</small>'}</div>
            </div>`;

        Swal.fire({ title: `Exams on ${date} March`, html: modalHtml, showConfirmButton: false, showCloseButton: true });
    }

    function loadFullList(code) { 
        Swal.close(); 
        document.getElementById("searchInput").value = code; 
        searchBySubjectCode(); 
    }

    function goToShironamPage() {
        if (currentStudents.length === 0) {
            Swal.fire("ডেটা নেই", "প্রথমে সার্চ করে স্টুডেন্ট লিস্ট আনুন।", "warning");
            return;
        }
        const examData = {
            examName: "Diploma in Engineering Final Exam - 2026",
            subName: document.getElementById("subDisplayName").innerText,
            subCode: document.getElementById("subDisplayCode").innerText,
            examDate: selectedDate
        };
        sessionStorage.setItem('currentStudents', JSON.stringify(currentStudents));
        sessionStorage.setItem('currentExamInfo', JSON.stringify(examData));
        window.location.href = 'shironam.html'; 
    }

    function sortTable(type) {
        if (type === 'roll') currentStudents.sort((a, b) => a.roll - b.roll);
        else currentStudents.sort((a, b) => a.sl - b.sl);
        renderTable(currentStudents);
    }

    function validateOfflineCode(val) {
        if (!val || !allSubjectsData || !Array.isArray(allSubjectsData)) return;

        // অ্যারে থেকে সাবজেক্ট কোডটি খুঁজে বের করা
        const subInfo = allSubjectsData.find(s => s.code.toString().trim() === val.trim());
        
        if (subInfo) {
            updateSubjectDisplay(val.trim(), subInfo);
        } else {
            // যদি কোড না মেলে তবে ডিসপ্লে ডিফল্ট করে দেওয়া (ঐচ্ছিক কিন্তু ভালো প্র্যাকটিস)
            document.getElementById("subDisplayCode").innerText = "---";
            document.getElementById("subDisplayName").innerText = "---";
        }
    }

    function updateSubjectDisplay(code, info) {
        document.getElementById("subDisplayCode").innerText = code;
        document.getElementById("subDisplayName").innerText = info.name;
        document.getElementById("subTF").innerText = info.tf;
        document.getElementById("subPF").innerText = info.pf;
    }

    function genSummary(data) {
        let counts = {};
        data.forEach(s => counts[s.inst] = (counts[s.inst] || 0) + 1);
        document.getElementById("instituteList").innerHTML = Object.entries(counts).map(([n, c]) => `
            <div class="d-flex justify-content-between border-bottom py-1"><span>${n}</span><strong>${c}</strong></div>
        `).join('');
    }
    
    function toggleSearch(s) { 
        document.getElementById("standardSearch").style.display = s ? "none" : "block"; 
        document.getElementById("specificSearch").style.display = s ? "block" : "none"; 
    }

    function initDropdowns() {
        fill("specInst", ["Pirgonj Polytechnic Institute", "Ranisonkoil Polytechnic Institute", "Ranisankail Ideal Non-Govt. Polytechnic Institute"]);
        fill("specTech", ["(64) Civil", "(66) Computer", "(67) Electrical", "(70) Mechanical", "(85) Computer"]);
        fill("specSemi", ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"]);
        fill("specSyllabus", ["2022", "2016"]);
    }

    function fill(id, list){
        const s = document.getElementById(id); 
        if(!s) return;
        list.forEach(i => { const o = document.createElement("option"); o.value = i; o.innerText = i; s.appendChild(o); }); 
    }

function showDetails(roll) {
    const student = currentStudents.find(s => s.roll.toString() === roll.toString());

    if (!student) {
        Swal.fire("Error", "শিক্ষার্থীর তথ্য পাওয়া যায়নি!", "error");
        return;
    }

    // টেকনোলজি কোড বের করা (যেমন: "(85) Computer" থেকে "85")
    const techMatch = student.dept.toString().trim().match(/\d+/);
    const techCode = techMatch ? techMatch[0] : "";
    
    const currentSemi = (student.semi || "").toString().trim(); 
    const studentSubList = (student.subcodes || "").toString().split(',').map(s => s.trim());

    let currentSemesterRows = "";
    let referredRows = "";

    studentSubList.forEach(code => {
        
        const sub = allSubjectsData.find(s => 
            s && s.code.toString().trim() === code && s.deptCode.toString().trim() === techCode
        );

        if (sub) {
            const subSemi = (sub.semi || "").toString().trim();
            const isReferred = (subSemi !== currentSemi);

            const rowHtml = `
                <tr style="font-size: 13px;">
                    <td class="fw-bold">${code}</td>
                    <td class="text-start">${sub.name || 'Unknown'}</td>
                    <td><span class="badge ${isReferred ? 'bg-danger' : 'bg-primary'}">${subSemi}</span></td>
                    <td>${sub.tf || 0} + ${sub.pf || 0}</td>
                </tr>`;

            if (isReferred) referredRows += rowHtml;
            else currentSemesterRows += rowHtml;
        } else {
            referredRows += `<tr class="table-light"><td class="fw-bold">${code}</td><td class="text-muted text-start">Not matched with Dept: ${techCode}</td><td>-</td><td>-</td></tr>`;
        }
    });

    Swal.fire({
        title: `Examinee Profile`,
        width: '750px',
        html: `
            <div class="text-start mb-3" style="font-size: 14px; background: #f8f9fa; padding: 12px; border-radius: 8px; border-left: 5px solid #1e3a5f;">
                <div class="row">
                    <div class="col-md-6"><strong>Name:</strong> ${student.name}</div>
                    <div class="col-md-6"><strong>Roll:</strong> ${student.roll}</div>
                    <div class="col-md-6"><strong>Technology:</strong> ${student.dept}</div>
                    <div class="col-md-6"><strong>Current Semi:</strong> <span class="badge bg-dark">${student.semi}</span></div>
                    <div class="col-md-6"><strong>Institute:</strong> ${student.inst}</div>
                    <div class="col-md-6"><strong>Type:</strong> ${student.type}</div>
                </div>
            </div>
            <div class="table-responsive">
                <h6 class="text-primary text-start border-bottom pb-1">Current Semi Subjects</h6>
                <table class="table table-sm table-bordered mb-3">
                    <thead class="table-light"><tr><th>Code</th><th>Subject Name</th><th>Semi</th><th>T+P</th></tr></thead>
                    <tbody>${currentSemesterRows || '<tr><td colspan="4">No current semester subjects</td></tr>'}</tbody>
                </table>
                ${referredRows ? `
                    <h6 class="text-danger text-start border-bottom pb-1 mt-3">Referred Subjects</h6>
                    <table class="table table-sm table-hover table-bordered">
                        <thead class="table-light"><tr><th>Code</th><th>Subject Name</th><th>Semi</th><th>T+P</th></tr></thead>
                        <tbody class="table-warning">${referredRows}</tbody>
                    </table>
                ` : ''}
            </div>
        `,
        confirmButtonText: 'Close',
        confirmButtonColor: '#1e3a5f'
    });
}


function filterSearch() {
    const inst = document.getElementById("specInst").value;
    const tech = document.getElementById("specTech").value;
    const semi = document.getElementById("specSemi").value;
    const syllabus = document.getElementById("specSyllabus").value;

    Swal.fire({ title: 'ফিল্টার করা হচ্ছে...', didOpen: () => Swal.showLoading() });

    const params = new URLSearchParams({
        action: "specificSearch", inst: inst, tech: tech, semi: semi, syllabus: syllabus
    });

    fetch(`${API_URL}?${params.toString()}`)
        .then(r => r.json())
        .then(res => {
            console.log(res);
            Swal.close();
            if (res.students && res.students.length > 0) {
                currentStudents = res.students;
                renderTable(currentStudents);
                genSummary(currentStudents);
                
                document.getElementById("subDisplayCode").innerText = "Multiple/Filtered";
                document.getElementById("subDisplayName").innerText = "Filtered Results";
            } else {
                currentStudents = [];
                renderTable([]);
                document.getElementById("instituteList").innerHTML = "No students found.";
                Swal.fire("দুঃখিত", "এই ফিল্টারে কোনো পরীক্ষার্থী পাওয়া যায়নি!", "info");
            }
        })
        .catch(err => {
            console.error(err);
            Swal.fire("Error", "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না।", "error");
        });
}

function toggleMoreButtons(btn) {
    const extraButtons = document.querySelectorAll('.extra-btn');
    const isHidden = extraButtons[0].classList.contains('d-none');

    if (isHidden) {
        extraButtons.forEach(el => el.classList.remove('d-none'));
        btn.innerHTML = "Less Buttons (-)";
        btn.classList.add('text-secondary'); 
    } else {
        extraButtons.forEach(el => el.classList.add('d-none'));
        btn.innerHTML = "More Buttons (+)";
        btn.classList.remove('text-secondary');
    }
}


function downloadCenterFee() {
    Swal.fire("Center Fee", "সেন্টার ফি ক্যালকুলেশনের লজিকটি এখনও সেট করা হয়নি।", "info");
}

function downloadSeatPlan() {
    Swal.fire("Seat Plan", "সীট প্ল্যান ডিজাইনের কাজ শীঘ্রই শুরু হবে।", "info");
}



</script>
</body>
</html>
