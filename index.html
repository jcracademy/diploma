<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  margin: 0;
  overflow: hidden;
}

/* Three.js canvas */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* Center content */
.container {
  position: relative;
  z-index: 2;
}

/* Glass effect */
.card {
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.75);
  border-radius: 12px;
}
</style>
</head>

<body>

<!-- 3D Background -->
<canvas id="bg"></canvas>

<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="text-center">

    <div class="mb-3 px-2 text-white">
      <h5 class="fw-bold mb-1">Diploma in Engineering Examination - 2026</h5>
      <small>Center: Pirganj TSC, Pirganj, Thakurgaon</small>
    </div>

    <div class="card shadow p-4 mx-auto text-start" style="width:350px;">
      <h4 class="text-center mb-3">User Login</h4>

      <div class="mb-3">
        <label class="form-label">User ID</label>
        <input type="text" id="userId" class="form-control" placeholder="Enter Teacher ID">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter Password">
      </div>

      <button id="loginBtn" class="btn btn-primary w-100" onclick="loginUser()">Login</button>

      <div id="msg" class="text-danger text-center mt-3"></div>
    </div>

  </div>
</div>

<!-- THREE JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// =====================
// LOGIN FUNCTION
// =====================
const API_URL = "https://script.google.com/macros/s/AKfycbxnmUcuFVLLK7pg9NsP8YVtC9LFjvhVMOV7vt08MWX09MIKl9LuNgZX4LXmR7jvHoZZ/exec";

function loginUser() {
  const uid = document.getElementById("userId").value.trim();
  const pwd = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("loginBtn");

  if (!uid || !pwd) {
    msg.innerText = "Please enter ID and Password";
    return;
  }

  msg.innerText = "Checking...";
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Please wait`;

  fetch(API_URL + "?action=login&uid=" + uid + "&pwd=" + pwd)
  .then(r => r.json())
  .then(res => {
    if(res.status === "ok") {
      sessionStorage.setItem("userId", uid);
      localStorage.setItem('allSubjectsData', JSON.stringify(res.subjects));
      localStorage.setItem('routineData', JSON.stringify(res.routine));
      localStorage.setItem('lastFetchTime', Date.now());

      location.href = "diploma.html";
    } else {
      msg.innerText = "Invalid login!";
      btn.disabled = false;
      btn.innerHTML = "Login";
    }
  })
  .catch(err => {
    console.error(err);
    msg.innerText = "Server error!";
    btn.disabled = false;
    btn.innerHTML = "Login";
  });
}


// =====================
// THREE.JS BACKGROUND
// =====================
const canvas = document.getElementById("bg");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(window.innerWidth, window.innerHeight);

// =====================
// SKYBOX (BOX METHOD)
// =====================

const loader = new THREE.TextureLoader();

const materials = [
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide }), // right
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide }), // left
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide }), // top
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide }), // bottom
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide }), // front
  new THREE.MeshBasicMaterial({ map: loader.load("bg.jpg"), side: THREE.BackSide })  // back
];

const skybox = new THREE.Mesh(
  new THREE.BoxGeometry(500, 500, 500),
  materials
);

scene.add(skybox);

// =====================
// CAMERA
// =====================
camera.position.set(0, 0, 0.1);

// =====================
// MOUSE CONTROL (LIMITED)
// =====================

let lon = 0, lat = 0;
let targetLon = 0, targetLat = 0;

document.addEventListener("mousemove", (event) => {
  const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
  const mouseY = (event.clientY / window.innerHeight) * 2 - 1;

  const maxRotation = 15;

  targetLon = mouseX * maxRotation;
  targetLat = mouseY * maxRotation;
});

// =====================
// ANIMATE
// =====================

function animate() {
  requestAnimationFrame(animate);

  lon += (targetLon - lon) * 0.05;
  lat += (targetLat - lat) * 0.05;

  lat = Math.max(-85, Math.min(85, lat));

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  const x = Math.sin(phi) * Math.cos(theta);
  const y = Math.cos(phi);
  const z = Math.sin(phi) * Math.sin(theta);

  camera.lookAt(x, y, z);

  renderer.render(scene, camera);
}

animate();

// =====================
// RESIZE FIX
// =====================

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
