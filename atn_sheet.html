<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atn Sheet</title>
    
    <!-- Google Fonts & html2pdf.js CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Serif Bengali', serif, Arial, sans-serif; background-color: #eef1f5; color: #000; padding: 20px; }
        
        .no-print { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; position: sticky; top: 10px; z-index: 1000; }
        .btn-action { background-color: #0d6efd; color: #fff; border: none; padding: 10px 24px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .btn-action:hover { background-color: #0b5ed7; }
        .btn-pdf { background-color: #198754; }
        .btn-pdf:hover { background-color: #157347; }

        .page-break { page-break-after: always; break-after: page; }
        .sheet-container { position: relative; width: 100%; max-width: 210mm; min-height: 297mm; background: #fff; margin: 0 auto 20px auto; padding: 10mm 12mm 6mm 12mm; box-shadow: 0 0 10px rgba(0,0,0,0.15); }
        .top-meta { position: absolute; top: 5mm; right: 10mm; z-index: 10; display: flex; line-height: 1.3; }
        .top-meta2 { position: absolute; top: 29mm; left: 14.5mm; z-index: 15; color: #00000086; }
        .header { position: relative; text-align: center; margin-top: 2px; margin-bottom: 5px; min-height: 60px; }
        .header .logo { position: absolute; left: 0; top: 0; width: 65px; height: auto; }
        .header h2 { font-size: 18px; font-weight: 700; }
        
        .code-box { display: inline-block; border-bottom: 1px dashed #000; padding: 0px 8px; margin-left: 4px; min-width: 90px; text-align: center; font-weight: bold; font-size: 18px; }
        .code-box2 { display: inline-block; border-bottom: 1px dashed #000; padding: 0px 8px; margin-left: 4px; min-width: 80px; font-weight: bold; font-size: 16px; text-align: center; }
        .institution-details { font-size: 13.5px; margin-bottom: 15px; }

        table.attendance-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 5px; table-layout: fixed; }
        table.attendance-table th, table.attendance-table td {
           border: 1px solid #000; height: 31px; padding: 0 5px; line-height: 28px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; vertical-align: middle;}
        
        table.attendance-table th {background-color: #fafafa; }
        table.attendance-table td.text-left { text-align: left; padding-left: 6px; font-size: 11px; }
        .section-divider { font-weight: bold; text-align: left !important; padding-left: 10px !important; background-color: #f5f5f5; }

        .footer { margin-top: 5px; font-size: 14px; }
        .footer .note { width: 100%; line-height: 2; margin-bottom: 40px; }
        .footer .signature-wrapper { display: flex; justify-content: flex-end; }
        .footer .signature { width: 35%; text-align: center; }
        .footer .sig-line { border-top: 1px solid #000; margin-bottom: 6px; width: 100%; }

        @page { size: A4 portrait; margin: 0mm; }
        @media print {
            body { background: none; padding: 0; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none; }
            .sheet-container { box-shadow: none; width: 100% !important; max-width: 100% !important; padding: 10mm 12mm 6mm 12mm !important; margin: 0 !important; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button class="btn-action" onclick="window.print()">🖨️ সরাসরি প্রিন্ট করুন</button>
        <button class="btn-action btn-pdf" onclick="downloadAllPDF()">📥 সব হাজিরা শিট একত্রে PDF নামান</button>
    </div>
    <div id="attendance-sheets-wrapper"></div>

    <script>
    let rangeInfo = { startSL: 1, endSL: 1 };

    function generateSheetHTML(student, isLast) {
        const allSubjectsData = JSON.parse(localStorage.getItem('allSubjectsData') || '[]');
        const rawCodes = student.subcodes ? student.subcodes.toString().split(',').map(c => c.trim()) : [];
        const techMatch = student.dept ? student.dept.toString().trim().match(/\d+/) : null;
        const techCode = techMatch ? techMatch[0] : "";
        const theoryList = [];
        const practicalList = [];

        console.log(allSubjectsData);
        rawCodes.forEach(code => {
            if (!code) return;

             
            let subInfo = allSubjectsData.find(s => 
                s.code && s.code.toString().trim() === code && (techCode && s.deptCode ? s.deptCode.toString().trim() === techCode : true)
            );

            if (!subInfo) { subInfo = allSubjectsData.find(s => s.code && s.code.toString().trim() === code);}

            if (subInfo) {
                console.log(subInfo.tf);
                const tf = parseInt(subInfo.tf) || 0;
                const pf = parseInt(subInfo.pf) || 0;
                if (tf > 0) {  theoryList.push({ code: subInfo.code, name: subInfo.name }); }
                if (pf > 0 && student.type === "Regular" && subInfo.semi === student.semi) { practicalList.push({ code: subInfo.code, name: subInfo.name }); }

            } else {
                theoryList.push({ code: code, name: '' });
            }
        });

        // ------------------ তাত্ত্বিক সারি তৈরি ------------------
        let theoryRows = '';
        const maxTheoryRows = 13;

        for (let i = 0; i < maxTheoryRows; i++) {
            const sub = theoryList[i] || { code: '', name: '' };
            theoryRows += `
                <tr>
                    <td></td>
                    <td></td>
                    <td style="text-align: center;">${sub.code || ''}</td>
                    <td class="text-left" title="${sub.name || ''}">${sub.name || ''}</td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            `;
        }

        // ------------------ ব্যবহারিক সারি তৈরি ------------------
        let practicalRows = '';
        const maxPracticalRows = 8;

        for (let i = 0; i < maxPracticalRows; i++) {
            const sub = practicalList[i] || { code: '', name: '' };
            practicalRows += `
                <tr>
                    <td></td>
                    <td></td>
                    <td style="text-align: center;">${sub.code || ''}</td>
                    <td class="text-left" title="${sub.name || ''}">${sub.name || ''}</td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            `;
        }

        const pageBreakClass = isLast ? '' : 'page-break';

        return `
        <div class="sheet-container ${pageBreakClass}">
            <div class="top-meta">
                <div style="position:absolute; left:-60px; top: 0px; font-size: 14px;">SL- ${student.sl || ''}</div>
                <div style="width: 190px; color: #00000086;">
                    <div style="text-align: center; font-size: 12px;">${student.name || ''}</div>
                    <div style="font-size: 10px; text-align: center;">${student.subcodeDetails || ''}</div>
                </div>
            </div>

            <div class="top-meta2">
                <div style="display: flex; font-size: 12px;">
                    <div>${student.dept || ''}</div>
                    <div style="width: 50px; margin-left: 5px;">${student.type}</div>
                </div>
            </div>

            <div class="header">
                <img src="logo.png" alt="বোর্ড লোগো" class="logo">
                <div style="font-size: 20px;">বাংলাদেশ কারিগরি শিক্ষা বোর্ড, ঢাকা</div>
                <div style="font-size: 15px;"> Diploma in Engineering Examination - ${student.semi || ''} Semester, পরীক্ষা ২০২৫ সন</div>
            </div>

            <div class="sheet-title" style="width: 100%; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 6px;">হাজিরা শিট</div>
            
            <div class="identity-row" style="display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin-bottom: 5px;">
                <div>রোল নং <span class="code-box">${student.roll || ''}</span></div>
                <div>রেজিস্ট্রেশন নং <span class="code-box">${student.regi || ''}</span></div>
                <div>সেশন <span class="code-box">${student.session || ''}</span></div>
            </div>

            <div class="institution-details">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>কেন্দ্রের নাম <span style="font-size: 14px; border-bottom: 1px dashed black;"> &nbsp;&nbsp; Pirganj Govt. Technical School and College, Pirganj, Thakurgaon</span></div>
                    <div>কেন্দ্র কোড <span class="code-box2">12144</span></div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>প্রতিষ্ঠানের নাম <span style="font-size: 14px; border-bottom: 1px dashed black;"> &nbsp;&nbsp; ${student.inst || ''}</span></div>
                    <div>প্রতিষ্ঠান কোড <span class="code-box2"> ${student.inst_code || ''}</span></div>
                </div>
            </div>

            <table class="attendance-table">
                <thead>
                    <tr>
                        <th style="width: 11%;">তারিখ</th>
                        <th style="width: 8%;">সময়</th>
                        <th style="width: 8%;">বিষয় <br> কোড</th>
                        <th style="width: 24%;">বিষয়</th>
                        <th style="width: 19%;">লিথো খাতার ক্রমিক নং</th>
                        <th style="width: 16%;">পরীক্ষার্থীর<br>স্বাক্ষর</th>
                        <th style="width: 14%;">ইনভিজিলেটরের<br>স্বাক্ষর</th>
                    </tr>
                </thead>
                <tbody>
                    ${theoryRows}
                    <tr><td colspan="7" class="section-divider">ব্যবহারিক বিষয়</td></tr>
                    ${practicalRows}
                </tbody>
            </table>

            <div class="footer">
                <div class="note">
                    <strong>দ্রষ্টব্যঃ</strong> কোনো পরীক্ষার্থী অনুপস্থিত থাকিলে সেক্ষেত্রে সংশ্লিষ্ট ইনভিজিলেটর যথাস্থানে <b>"অনুপস্থিত"</b> লিখিয়া স্বাক্ষর করিবেন।
                </div>
                <div class="signature-wrapper">
                    <div class="signature">
                        <div class="sig-line"></div>
                        <div>পরীক্ষা কেন্দ্রের ভারপ্রাপ্ত কর্মকর্তার স্বাক্ষর</div>
                    </div>
                </div>
            </div>
        </div>
        `;
    }

    document.addEventListener('DOMContentLoaded', () => {
        // localStorage থেকে ডাটা নেওয়া
        const storedData = sessionStorage.getItem('attendanceStudents');
        const storedRange = sessionStorage.getItem('attendanceRange');
    

        if (!storedData) {
            document.getElementById('attendance-sheets-wrapper').innerHTML = 
                '<h2 style="text-align:center; color:red; margin-top:50px;">কোনো ডাটা পাওয়া যায়নি! অনুগ্রহ করে মূল পেজ থেকে হাজিরা শিট রিকোয়েস্ট করুন।</h2>';
            return;
        }

        const students = JSON.parse(storedData);
        if (storedRange) rangeInfo = JSON.parse(storedRange);

        const wrapper = document.getElementById('attendance-sheets-wrapper');
        let fullHTML = '';

        students.forEach((student, index) => {
            const isLast = index === students.length - 1;
            fullHTML += generateSheetHTML(student, isLast);
        });

        wrapper.innerHTML = fullHTML;

    });


    function downloadAllPDF() {
        const element = document.getElementById('attendance-sheets-wrapper');
        const btnContainer = document.querySelector('.no-print');
        
        // ডাউনলোডের সময় বাটন হাইড করা
        btnContainer.style.display = 'none';

        const opt = {
            margin:       0,
            filename:     `Students_Attendance_Sheets_SL_${rangeInfo.startSL}_to_${rangeInfo.endSL}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btnContainer.style.display = 'flex'; // ডাউনলোড শেষে বাটন পুনরায় দেখানো
        });
    }
  
    </script>
</body>
</html>
